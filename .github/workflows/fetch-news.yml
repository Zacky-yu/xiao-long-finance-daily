name: 📰 定时抓取新闻

on:
  schedule:
    # 每30分钟抓取一次（UTC时间，北京 = UTC+8）
    - cron: '*/30 * * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取新闻
        run: node news-fetch.js

      - name: 提交更新
        run: |
          git config user.name "finance-daily-bot"
          git config user.email "finance-daily-bot@users.noreply.github.com"
          git add news-cache.json
          git diff --cached --quiet && echo "无变化，跳过提交" || {
            git commit -m "🤖 自动更新新闻缓存 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          }
