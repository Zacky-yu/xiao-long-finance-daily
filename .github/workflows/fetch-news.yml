name: 📰 定时抓取新闻

on:
  schedule:
    # ⚠️ GitHub 的 cron 是“尽力而为”，高负载时会延迟甚至丢弃任务；
    # 因此多挂几个“错峰”时间点，尽量保证每 10~15 分钟至少能触发一次。
    # （北京 = UTC+8）
    - cron: '*/30 * * * *'
    - cron: '8,38 * * * *'
    - cron: '18,48 * * * *'
    - cron: '27,57 * * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

# 串行化：避免多个抓取任务并发 push main 造成 `fetch first` 被拒
concurrency:
  group: fetch-news-push
  cancel-in-progress: false

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取实时新闻 (MarketWatch)
        run: node news-fetch.js

      - name: 抓取行业资讯 (12赛道108源 + 翻译)
        run: node industry-news-fetch.js

      - name: 抓取全球央行黄金持仓 (WGC / IMF IFS)
        run: node central-banks-fetch.js

      - name: 提交更新
        run: |
          git config user.name "finance-daily-bot"
          git config user.email "finance-daily-bot@users.noreply.github.com"
          git add news-cache.json industry-news.json industry-data.js translate-cache.json central-banks.json
          if git diff --cached --quiet; then echo "无变化，跳过提交"; exit 0; fi
          git commit -m "🤖 自动更新新闻缓存 $(date -u +'%Y-%m-%d %H:%M') UTC"
          for i in 1 2 3 4 5; do
            if git push origin HEAD:main; then echo "push ok (attempt $i)"; exit 0; fi
            echo "push 失败，先合并远端再重试（第 $i 次）"
            git fetch origin main
            # -X ours：冲突时以本次刚抓取的新数据为准
            git merge --no-edit -X ours origin/main || git merge --abort || true
            sleep 4
          done
          echo "::error::push 重试 5 次仍失败"; exit 1
