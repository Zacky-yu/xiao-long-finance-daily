name: 📰 定时抓取新闻

on:
  schedule:
    # ⚠️ GitHub 的 cron 是“尽力而为”，高负载时会延迟甚至丢弃任务；
    # 因此多挂几个“错峰”时间点，尽量保证每 10~15 分钟至少能触发一次。
    # （北京 = UTC+8）
    - cron: '*/30 * * * *'
    - cron: '8,38 * * * *'
    - cron: '18,48 * * * *'
    - cron: '27,57 * * * *'
  workflow_dispatch: # 支持手动触发

permissions:
  contents: write

jobs:
  fetch-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取实时新闻 (MarketWatch)
        run: node news-fetch.js

      - name: 抓取行业资讯 (12赛道108源 + 翻译)
        run: node industry-news-fetch.js

      - name: 抓取全球央行黄金持仓 (WGC / IMF IFS)
        run: node central-banks-fetch.js

      - name: 提交更新
        run: |
          git config user.name "finance-daily-bot"
          git config user.email "finance-daily-bot@users.noreply.github.com"
          git add news-cache.json industry-news.json industry-data.js translate-cache.json central-banks.json
          git diff --cached --quiet && echo "无变化，跳过提交" || {
            git commit -m "🤖 自动更新新闻缓存 $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          }
